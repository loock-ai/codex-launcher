name: Publish npm Package

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 独立CLI发布版本（与安卓App发布解耦）
        required: true
        type: string
  workflow_call:
    inputs:
      app_version:
        description: Version shared by the mobile release
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release-${{ inputs.app_version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish codex-mobile to npm
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Match npm version to GitHub Release
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          version="${APP_VERSION#v}"
          node -e '
            const version = process.argv[1];
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) {
              throw new Error(`Invalid release version: ${version}`);
            }
          ' "$version"
          npm version "$version" --no-git-tag-version --allow-same-version
          test "$(node -p "require('./package.json').name")" = "codex-mobile"
          test "$(node -p "require('./package.json').version")" = "$version"

      - name: Test package
        run: npm test

      - name: Build frontend and gateway
        run: npm run build:package

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Publish matching npm package
        run: npm publish --access public
