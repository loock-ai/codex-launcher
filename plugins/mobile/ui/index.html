<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mobile</title><link rel="stylesheet" href="style.css"></head><body>
<header><div><small>插件 / MOBILE</small><h1>随时继续你的工作</h1><p>连接手机与桌面上的 Codex。</p></div><span id="state">加载中</span></header>
<nav><button data-page="connection" class="selected">连接</button><button data-page="settings">设置</button><button data-page="approvals">审批</button><button data-page="logs">日志</button></nav>
<p id="error" role="alert" hidden></p>
<section id="connection"><article><h2>Mobile 服务</h2><p id="summary"></p><div class="actions"><button class="primary" data-action="__runtime.start">启动</button><button data-action="__runtime.stop">停止</button><button data-action="open-web">打开 Web</button><button data-action="copy-url">复制连接链接</button></div></article><article><h2>手机连接</h2><p>手机与电脑连接同一网络后，扫描二维码访问。</p><details id="qr"><summary>显示连接二维码</summary><img id="qr-image" alt="Mobile 连接二维码"><p id="address"></p><small>二维码包含访问口令，请仅分享给可信设备。</small></details></article></section>
<section id="settings" hidden><form id="config"><article><h2>连接方式</h2><label>连接模式<select name="mode"><option value="cdp">共享 Desktop（CDP）</option><option value="managed">托管 app-server</option><option value="external">外部 app-server</option></select></label><p id="desktop"></p><small>Desktop 应用路径和 CDP 端口由启动器的桌面设置管理。</small></article><article><h2>网络与访问</h2><label>监听范围<select name="host"><option value="0.0.0.0">局域网设备可访问</option><option value="127.0.0.1">仅本机</option></select></label><label>Web 端口<input name="gatewayPort" type="number" min="1" max="65535" required></label><label>访问口令<input name="token" type="password" autocomplete="new-password" placeholder="留空保留现有口令"></label><label>托管 app-server 端口<input name="appServerPort" type="number" min="1" max="65535" required></label><label>外部 app-server 地址<input name="upstreamUrl" type="url" required></label><p>修改配置前请停止 Mobile 服务。</p><button class="primary" type="submit">保存配置</button></article></form></section>
<section id="approvals" hidden><article><h2>待处理审批</h2><p>在 Web 中查看上下文并处理审批。</p><button data-action="open-web">打开 Web 处理</button><div id="approval-list"></div></article></section>
<section id="logs" hidden><article><h2>运行日志</h2><pre id="log-lines"></pre></article></section>
<script src="app.js"></script></body></html>
